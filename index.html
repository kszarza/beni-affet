<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beni Affeder misin? 💖</title>
    <style>
        :root {
            --primary: #ff4d6d;
            --secondary: #ff758c;
            --accent: #ffb3c1;
            --bg-gradient: linear-gradient(135deg, #ff758c 0%, #ff7ea5 50%, #ffe5ec 100%);
            --text-color: #590d22;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Arka plan kalpleri */
        .floating-hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            color: rgba(255, 255, 255, 0.4);
            font-size: 20px;
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(89, 13, 34, 0.15);
            max-width: 600px;
            width: 90%;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        /* Fotoğraf Galerisi (Çoklu Fotoğraf) */
        .gallery-title {
            font-size: 15px;
            color: #800f2f;
            margin-bottom: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        .photo-card {
            aspect-ratio: 1;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid var(--primary);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            background: #ffe5ec;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #a53860;
            text-align: center;
            padding: 5px;
            transition: transform 0.3s ease;
        }

        .photo-card:hover {
            transform: scale(1.05);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #590d22;
        }

        .subtitle {
            font-size: 15px;
            color: #720935;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 130px;
            flex-wrap: wrap;
            position: relative;
        }

        .btn {
            padding: 14px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
            user-select: none;
        }

        #evet-btn {
            background-color: #2ec4b6;
            color: white;
            box-shadow: 0 6px 20px rgba(46, 196, 182, 0.4);
            z-index: 20;
            transform-origin: center;
        }

        #evet-btn:hover {
            background-color: #25a194;
        }

        #hayir-btn {
            background-color: #e71d36;
            color: white;
            box-shadow: 0 6px 20px rgba(231, 29, 54, 0.4);
            transform-origin: center;
        }

        .excuse-text {
            font-size: 14px;
            color: #d90429;
            font-weight: bold;
            height: 20px;
            margin-bottom: 10px;
            transition: opacity 0.3s;
        }

        .message {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            color: #2ec4b6;
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Yüzen Kalpler Arka Planı -->
    <div class="floating-hearts" id="hearts-container"></div>

    <div class="container">
        <div class="gallery-title">💖 En Güzel Anılarımız 💖</div>
        
        <!-- Fotoğraf Alanı (Buraya fotoğraflarını foto1.jpg, foto2.jpg, foto3.jpg olarak ekleyebilirsin) -->
        <div class="photo-grid">
            <div class="photo-card">
                <img src="foto1.jpg" alt="Anı 1" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Fotoğraf 1<br>(foto1.jpg)</span>';">
            </div>
            <div class="photo-card">
                <img src="foto2.jpg" alt="Anı 2" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Fotoğraf 2<br>(foto2.jpg)</span>';">
            </div>
            <div class="photo-card">
                <img src="foto3.jpg" alt="Anı 3" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Fotoğraf 3<br>(foto3.jpg)</span>';">
            </div>
        </div>

        <h1>Beni affeder misin? 🥺</h1>
        <p class="subtitle">Biliyorum bir hata yaptım, kalbini kırdım... Ama seni çok seviyorum ve bir şans daha hak ediyorum.</p>

        <div class="excuse-text" id="excuse"></div>

        <div class="buttons-container" id="btn-group">
            <button class="btn" id="evet-btn" onclick="sayYes()">Evet, affettim 💖</button>
            <button class="btn" id="hayir-btn" onclick="sayNo()">Hayır 💔</button>
        </div>

        <div class="message" id="success-msg">Dünyanın en mutlu insanı yaptın beni! Seni çok seviyorum, bir daha asla üzmeyeceğim! 🥰✨</div>
    </div>

    <script>
        // Arka plana dinamik yüzen kalpler ekleme
        const heartsContainer = document.getElementById('hearts-container');
        const heartSymbols = ['💖', '❤️', '💕', '✨', '💗'];

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            heart.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }
        setInterval(createHeart, 400);

        // Hayır butonu mantığı
        let hayirScale = 1;
        let evetScale = 1;
        const excuses = [
            "Emin misin? Tekrar düşün bence 🥺",
            "Bak ama küserim kalbin kırılır 😢",
            "Hayır seçeneği aslında yok ki 😉",
            "Parmakların yanlış tuşa basıyor galiba 🧐",
            "Lütfen amaa uzatmayalım 🥰",
            "Tek çaren 'Evet' basın, ısrar etme 😄"
        ];
        let excuseIndex = 0;

        function sayNo() {
            hayirScale -= 0.15;
            evetScale += 0.3;

            const hayirBtn = document.getElementById('hayir-btn');
            const evetBtn = document.getElementById('evet-btn');
            const excuseEl = document.getElementById('excuse');

            excuseEl.textContent = excuses[excuseIndex % excuses.length];
            excuseIndex++;

            if (hayirScale > 0.05) {
                hayirBtn.style.transform = `scale(${hayirScale})`;
            } else {
                hayirBtn.style.transform = `scale(0.05)`;
                hayirBtn.style.opacity = '0.1';
                hayirBtn.style.pointerEvents = 'none';
            }

            evetBtn.style.transform = `scale(${evetScale})`;
        }

        function sayYes() {
            document.getElementById('btn-group').style.display = 'none';
            document.querySelector('h1').style.display = 'none';
            document.querySelector('.subtitle').style.display = 'none';
            document.getElementById('excuse').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
        }
    </script>
</body>
</html>
