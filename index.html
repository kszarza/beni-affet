<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beni Affeder misin?</title>
    <style>
        :root {
            --primary-color: #ff4d6d;
            --secondary-color: #ff758c;
            --bg-color: #fff0f3;
            --text-color: #590d22;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 77, 109, 0.15);
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 1;
        }

        .photo-frame {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .photo-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            background-color: #ffe5ec;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #a53860;
            text-align: center;
            overflow: hidden;
        }

        .photo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 30px;
            color: var(--text-color);
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 120px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
            outline: none;
            user-select: none;
        }

        #evet-btn {
            background-color: #2ec4b6;
            color: white;
            box-shadow: 0 4px 15px rgba(46, 196, 182, 0.4);
            z-index: 10;
            transform-origin: center;
        }

        #hayir-btn {
            background-color: #e71d36;
            color: white;
            box-shadow: 0 4px 15px rgba(231, 29, 54, 0.4);
            transform-origin: center;
        }

        .message {
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
            color: #2ec4b6;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Fotoğraflar: Kendi fotoğrafını ve onun fotoğrafını klasöre ben.jpg ve o.jpg olarak atabilirsin -->
        <div class="photo-frame">
            <div class="photo-placeholder">
                <img src="ben.jpg" alt="Ben" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Senin Fotoğrafın<br>(ben.jpg)</span>';">
            </div>
            <div class="photo-placeholder">
                <img src="o.jpg" alt="O" onerror="this.style.display='none'; this.parentElement.innerHTML='<span>Onun Fotoğrafı<br>(o.jpg)</span>';">
            </div>
        </div>

        <h1>Beni affeder misin? 🥺</h1>

        <div class="buttons-container" id="btn-group">
            <button class="btn" id="evet-btn" onclick="sayYes()">Evet 💖</button>
            <button class="btn" id="hayir-btn" onclick="sayNo()">Hayır 💔</button>
        </div>

        <div class="message" id="success-msg">Yaaaa çok teşekkür ederim, seni çok seviyorum! 🥰</div>
    </div>

    <script>
        let hayirScale = 1;
        let evetScale = 1;

        function sayNo() {
            hayirScale -= 0.15;
            evetScale += 0.25;

            const hayirBtn = document.getElementById('hayir-btn');
            const evetBtn = document.getElementById('evet-btn');

            if (hayirScale > 0.05) {
                hayirBtn.style.transform = `scale(${hayirScale})`;
            } else {
                // Tıklanamayacak kadar küçült ve etkisiz hale getir
                hayirBtn.style.transform = `scale(0.05)`;
                hayirBtn.style.opacity = '0.1';
                hayirBtn.style.pointerEvents = 'none';
            }

            evetBtn.style.transform = `scale(${evetScale})`;
        }

        function sayYes() {
            document.getElementById('btn-group').style.display = 'none';
            document.querySelector('h1').style.display = 'none';
            document.getElementById('success-msg').style.display = 'block';
        }
    </script>

</body>
</html>
